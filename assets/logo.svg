<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="live-agent logo">
  <defs>
    <radialGradient id="orb" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e8f0ff"/>
      <stop offset="0.35" stop-color="#7aa7ff"/>
      <stop offset="0.75" stop-color="#6a4cff"/>
      <stop offset="1" stop-color="#2a1a7a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="0.5" stop-color="#9b6bff"/>
      <stop offset="1" stop-color="#ff6ba8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="#0d0b1f"/>
  <circle cx="128" cy="128" r="92" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.35"/>
  <circle cx="128" cy="128" r="76" fill="none" stroke="url(#ring)" stroke-width="5" opacity="0.6"/>
  <circle cx="128" cy="128" r="56" fill="url(#orb)" filter="url(#glow)"/>
  <g fill="#ffffff" opacity="0.95">
    <rect x="99"  y="118" width="8" height="20" rx="4"/>
    <rect x="113" y="106" width="8" height="44" rx="4"/>
    <rect x="127" y="96"  width="8" height="64" rx="4"/>
    <rect x="141" y="108" width="8" height="40" rx="4"/>
    <rect x="155" y="120" width="8" height="16" rx="4"/>
  </g>
</svg>
