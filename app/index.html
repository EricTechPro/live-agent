<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>live-agent</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!--
      Layout (spec story 46/47): orb + transcript on the left, job board on the
      right, bottom bar under both. Ticket 10 fills #jobs and #bar.
    -->
    <main class="shell">
      <section class="voice" aria-label="Voice">
        <div class="orb-wrap">
          <div id="orb" class="orb" data-state="connecting" role="img" aria-label="Agent state: connecting"></div>
          <p id="orb-label" class="orb-label" aria-live="polite">Starting…</p>
          <button id="talk" class="talk" type="button" disabled>Start talking</button>
          <div class="quiet-buttons">
            <button id="new-chat" class="setup" type="button" disabled title="Save this chat to your brain and start a fresh one">New chat</button>
            <button id="setup" class="setup" type="button" disabled title="Run the setup chat again">Setup</button>
            <button id="show-log" class="setup" type="button" title="Show the core's log file in Finder">Show log</button>
          </div>
        </div>
        <ol id="transcript" class="transcript" aria-label="Transcript" aria-live="polite"></ol>
        <form id="type" class="type">
          <input id="type-input" type="text" placeholder="Or type to it…" autocomplete="off" disabled />
        </form>
      </section>
      <aside id="jobs" class="jobs" aria-label="Job board"></aside>
      <footer id="bar" class="bar" aria-label="Status"></footer>
    </main>
    <!--
      First launch with no Gemini key (ticket 19). The key passes through here
      once, to the core, which checks and saves it. It is never shown again.
    -->
    <section id="key-screen" class="key-screen" hidden aria-labelledby="key-title">
      <form id="key-form" class="key-card">
        <h1 id="key-title">Paste your Gemini key</h1>
        <p>live-agent talks with Google Gemini. Get a free key at
          <a id="key-link" href="https://aistudio.google.com/apikey">aistudio.google.com/apikey</a>,
          then paste it here.</p>
        <input id="key-input" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…" aria-label="Gemini key" />
        <button id="key-save" class="talk" type="submit">Save and start</button>
        <p id="key-error" class="key-error" role="alert"></p>
        <p class="key-note">It is saved in your live-agent folder (in <code>.env</code>, readable only by you). The window never shows it again.</p>
      </form>
    </section>
  </body>
</html>
