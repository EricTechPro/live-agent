<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>live-agent</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!--
      Layout (spec story 46/47): orb + transcript on the left, job board on the
      right, bottom bar under both. Ticket 10 fills #jobs and #bar.
    -->
    <main class="shell">
      <section class="voice" aria-label="Voice">
        <div class="orb-wrap">
          <div id="orb" class="orb" data-state="connecting" role="img" aria-label="Agent state: connecting"></div>
          <p id="orb-label" class="orb-label" aria-live="polite">Starting…</p>
          <button id="talk" class="talk" type="button" disabled>Start talking</button>
        </div>
        <ol id="transcript" class="transcript" aria-label="Transcript" aria-live="polite"></ol>
        <form id="type" class="type">
          <input id="type-input" type="text" placeholder="Or type to it…" autocomplete="off" disabled />
        </form>
      </section>
      <aside id="jobs" class="jobs" aria-label="Job board"></aside>
      <footer id="bar" class="bar" aria-label="Status"></footer>
    </main>
  </body>
</html>
