# `bun test` runs only the fast tests in ./test (no network, no key).
# The live smoke test lives in ./smoke and runs with `bun run smoke`,
# so a key in .env never turns every test run into a paid network call.
[test]
root = "test"
# Runs every test from a temp copy of the sample brain, so chat-end notes never land in the repo.
preload = ["./test/preload.ts"]
