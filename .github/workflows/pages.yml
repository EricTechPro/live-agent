name: pages

# Publishes the public landing page to GitHub Pages, and nothing else:
#   /           site/index.html (landing)
#   /assets/    site/assets/ (logo, diagram thumbnails)
#   /diagrams/  site/diagrams/ (the two archify diagrams, standalone HTML)
# Same shape as EricTechPro/super-board's pages workflow.
# Only files in this repo are copied; no event input is interpolated.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          touch _site/.nojekyll
          find _site -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
